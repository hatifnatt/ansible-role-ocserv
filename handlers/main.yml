---
- name: OCServ | Restart service
  ansible.builtin.service:
    name: "{{ ocserv_service_name }}"
    state: restarted

- name: OCServ | Reload service
  ansible.builtin.service:
    name: "{{ ocserv_service_name }}"
    state: reloaded

- name: OCServ | Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
